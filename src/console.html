<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
  <title>Op Launcher Console</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <div class="bg-dim"></div>

  <header class="titlebar">
    <div class="title-left">
      <img src="../assets/logo.png" class="title-logo" alt="" />
      <span>Op Launcher · Console</span>
    </div>
    <div class="title-right">
      <button class="win-btn" id="btn-min" title="Minimize">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <button class="win-btn" id="btn-max" title="Maximize">
        <svg class="ico-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
        <svg class="ico-restore" viewBox="0 0 24 24"><rect x="5" y="9" width="10" height="10" rx="1.5"/><path d="M9 9V6.5A1.5 1.5 0 0 1 10.5 5H17.5A1.5 1.5 0 0 1 19 6.5V13.5A1.5 1.5 0 0 1 17.5 15H15"/></svg>
      </button>
      <button class="win-btn close" id="btn-close" title="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <main class="con-page">
    <div class="con-wrap">
          <div class="con-main">
            <div class="con-bar">
              <div class="con-search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
                <input type="text" id="con-search" placeholder="Search logs..." autocomplete="off" spellcheck="false" />
              </div>
              <button class="icon-btn" id="con-copy" type="button" title="Copy log" aria-label="Copy log">
                <svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg>
              </button>
              <button class="icon-btn" id="con-folder" type="button" title="Open logs folder" aria-label="Open logs folder">
                <svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
              </button>
              <button class="icon-btn" id="con-clear" type="button" title="Clear" aria-label="Clear">
                <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9.5 7V5h5v2"/><path d="M7 7l.8 12h8.4L17 7"/></svg>
              </button>
            </div>
            <div class="con-log" id="con-log"></div>
          </div>

          <aside class="con-side">
            <div class="cs-card">
              <div class="cs-title"><span class="cs-dot" id="cs-dot"></span><span id="cs-title">Minecraft</span></div>
              <div class="cs-row"><span>Status</span><b id="cs-status">Idle</b></div>
              <div class="cs-row"><span>Session</span><b id="cs-session">-</b></div>
              <div class="cs-row"><span>Account</span><b id="cs-account">-</b></div>
              <button class="btn-danger" id="cs-action" type="button" hidden>Cancel Launch</button>
            </div>
          </aside>
        </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="console-window.js"></script>
</body>
</html>
